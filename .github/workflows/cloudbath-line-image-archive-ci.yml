name: Cloudbath LINE Image Archive CI

on:
  pull_request:
    paths:
      - "extensions/cloudbath-line-image-archive/**"
      - "extensions/line/**"
      - "scripts/cloudbath/setup-notion-image-archive*"
      - "deploy/cloudbath/railway/Dockerfile"
      - "src/gateway/server/plugins-http.suspension-admission.test.ts"
      - "railway.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/cloudbath-line-image-archive-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  targeted-validation:
    name: Targeted validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENCLAW_VITEST_MAX_WORKERS: "4"
    steps:
      - name: Checkout PR commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node, Corepack, pnpm, cache, and dependencies
        id: dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          frozen-lockfile: "true"
          use-actions-cache: "true"
          save-actions-cache: "true"

      - name: Check official LINE shrinkwrap
        if: steps.dependencies.outcome == 'success' && !cancelled()
        run: |
          if ! node scripts/generate-npm-shrinkwrap.mjs --check --package-dir extensions/line; then
            node scripts/generate-npm-shrinkwrap.mjs --package-dir extensions/line
            git --no-pager diff -- extensions/line/npm-shrinkwrap.json
            exit 1
          fi

      - name: Run focused Vitest suite
        if: steps.dependencies.outcome == 'success' && !cancelled()
        run: |
          node scripts/run-vitest.mjs run \
            extensions/cloudbath-line-image-archive/src/analysis.test.ts \
            extensions/cloudbath-line-image-archive/src/character-view-route.test.ts \
            extensions/cloudbath-line-image-archive/src/config.test.ts \
            extensions/cloudbath-line-image-archive/src/group-workspace-policy.test.ts \
            extensions/cloudbath-line-image-archive/src/inbound.test.ts \
            extensions/cloudbath-line-image-archive/src/keep-watching.test.ts \
            extensions/cloudbath-line-image-archive/src/notion-schema.test.ts \
            extensions/cloudbath-line-image-archive/src/notion.test.ts \
            extensions/cloudbath-line-image-archive/src/notion-tools.test.ts \
            extensions/cloudbath-line-image-archive/src/pipeline.test.ts \
            extensions/cloudbath-line-image-archive/src/previs.test.ts \
            extensions/cloudbath-line-image-archive/src/previs-phase2a.test.ts \
            extensions/cloudbath-line-image-archive/src/previs-phase2b.test.ts \
            extensions/cloudbath-line-image-archive/src/profiles.test.ts \
            extensions/cloudbath-line-image-archive/src/r2.test.ts \
            extensions/cloudbath-line-image-archive/src/retry.test.ts \
            extensions/cloudbath-line-image-archive/src/ugc-character-image.test.ts \
            extensions/cloudbath-line-image-archive/src/ugc-character-lock.test.ts \
            extensions/cloudbath-line-image-archive/src/ugc-character-notion.test.ts \
            extensions/cloudbath-line-image-archive/src/ugc-multi-character.test.ts \
            extensions/cloudbath-line-image-archive/src/ugc-workflow.test.ts \
            extensions/cloudbath-line-image-archive/workspace-policy-runtime.integration.test.ts \
            test/cloudbath-workspace-policy-prewarm.integration.test.ts

      - name: Run setup-script Vitest suite
        if: steps.dependencies.outcome == 'success' && !cancelled()
        run: |
          config_file=.cloudbath-setup-vitest.config.ts
          trap 'rm -f "$config_file"' EXIT
          cat > "$config_file" <<'EOF'
          import { defineConfig } from "vitest/config";

          export default defineConfig({
            test: {
              include: ["scripts/cloudbath/setup-notion-image-archive.test.ts"],
              passWithNoTests: false,
            },
          });
          EOF
          pnpm exec vitest run --config "$config_file"

      - name: Verify LINE plugin selection and startup activation
        if: steps.dependencies.outcome == 'success' && !cancelled()
        run: |
          selected="$(node scripts/lib/docker-plugin-selection.mjs extensions 'cloudbath-line-image-archive,line')"
          test "$selected" = "$(printf 'cloudbath-line-image-archive\nline')"
          node scripts/run-vitest.mjs run \
            test/scripts/docker-plugin-selection.test.ts \
            src/plugins/bundled-channel-runtime.test.ts \
            src/plugins/channel-plugin-ids.test.ts \
            src/gateway/server-startup-log.test.ts

      - name: Run official LINE regression tests
        if: steps.dependencies.outcome == 'success' && !cancelled()
        run: |
          node scripts/run-vitest.mjs run \
            extensions/line/src/bot-handlers.test.ts \
            extensions/line/src/config-schema.test.ts \
            extensions/line/src/outbound-media-staging.test.ts \
            extensions/line/src/outbound-media.test.ts \
            extensions/line/src/monitor.lifecycle.test.ts \
            extensions/line/src/video-confirmation.test.ts \
            extensions/line/src/video-draft-production-seam.integration.test.ts \
            extensions/line/src/video-draft-reply-relay.test.ts \
            extensions/line/src/video-draft-tool.test.ts \
            extensions/line/src/video-model-control.test.ts \
            extensions/line/src/video-model-preference.test.ts \
            extensions/line/src/video-outbound-staging.test.ts \
            extensions/line/src/video-owner-flow.e2e.test.ts \
            extensions/line/src/video-ugc-scope.test.ts \
            extensions/line/src/model-catalog-tool.test.ts \
            src/agents/tools/session-status-tool.line-owner-auth.test.ts \
            extensions/line/src/session-route.test.ts \
            extensions/line/src/send.test.ts \
            extensions/line/src/signature.test.ts \
            extensions/line/src/webhook-node.test.ts \
            src/auto-reply/reply/commands-models.test.ts

      - name: Typecheck core
        if: steps.dependencies.outcome == 'success' && !cancelled()
        run: pnpm tsgo:core

      - name: Typecheck extensions
        if: steps.dependencies.outcome == 'success' && !cancelled()
        run: pnpm tsgo:extensions

      - name: Typecheck scripts
        if: steps.dependencies.outcome == 'success' && !cancelled()
        run: pnpm tsgo:scripts

      - name: Check formatting
        if: steps.dependencies.outcome == 'success' && !cancelled()
        run: |
          paths=(
            extensions/cloudbath-line-image-archive
            test/cloudbath-workspace-policy-prewarm.integration.test.ts
            extensions/line/index.ts
            extensions/line/src/bot-handlers.ts
            extensions/line/src/bot-handlers.test.ts
            extensions/line/src/model-catalog-tool.ts
            extensions/line/src/model-catalog-tool.test.ts
            src/agents/tools/session-status-tool.ts
            src/agents/tools/session-status-tool.line-owner-auth.test.ts
            src/agents/openclaw-tools.ts
            extensions/line/src/outbound-media-staging.ts
            extensions/line/src/outbound-media-staging.test.ts
            extensions/line/src/outbound-media.ts
            extensions/line/src/outbound-media.test.ts
            extensions/line/src/send.ts
            extensions/line/src/send.test.ts
            extensions/line/src/video-confirmation.ts
            extensions/line/src/video-confirmation.test.ts
            extensions/line/src/video-draft-production-seam.integration.test.ts
            extensions/line/src/video-draft-tool.ts
            extensions/line/src/video-draft-tool.test.ts
            extensions/line/src/video-model-control.ts
            extensions/line/src/video-model-preference.ts
            extensions/line/src/video-model-preference.test.ts
            extensions/line/src/video-outbound-staging.ts
            extensions/line/src/video-outbound-staging.test.ts
            extensions/line/src/video-owner-flow.e2e.test.ts
            scripts/cloudbath/setup-notion-image-archive.ts
            scripts/cloudbath/setup-notion-image-archive.test.ts
            src/auto-reply/reply/commands-models.ts
          )
          if ! pnpm exec oxfmt --check --threads=1 "${paths[@]}"; then
            pnpm exec oxfmt --write --threads=1 "${paths[@]}"
            git --no-pager diff -- "${paths[@]}"
            exit 1
          fi

      - name: Lint plugin
        if: steps.dependencies.outcome == 'success' && !cancelled()
        run: |
          node scripts/run-oxlint.mjs \
            --tsconfig config/tsconfig/oxlint.extensions.json \
            extensions/line/index.ts \
            extensions/cloudbath-line-image-archive \
            test/cloudbath-workspace-policy-prewarm.integration.test.ts

      - name: Lint scoped LINE changes
        if: steps.dependencies.outcome == 'success' && !cancelled()
        run: |
          node scripts/run-oxlint.mjs \
            --tsconfig config/tsconfig/oxlint.extensions.json \
            extensions/line/src/bot-handlers.ts \
            extensions/line/src/bot-handlers.test.ts \
            extensions/line/src/model-catalog-tool.ts \
            extensions/line/src/model-catalog-tool.test.ts \
            src/agents/tools/session-status-tool.ts \
            src/agents/tools/session-status-tool.line-owner-auth.test.ts \
            src/agents/openclaw-tools.ts \
            extensions/line/src/outbound-media-staging.ts \
            extensions/line/src/outbound-media-staging.test.ts \
            extensions/line/src/outbound-media.ts \
            extensions/line/src/outbound-media.test.ts \
            extensions/line/src/send.ts \
            extensions/line/src/send.test.ts \
            extensions/line/src/video-confirmation.ts \
            extensions/line/src/video-confirmation.test.ts \
            extensions/line/src/video-draft-production-seam.integration.test.ts \
            extensions/line/src/video-draft-tool.ts \
            extensions/line/src/video-draft-tool.test.ts \
            extensions/line/src/video-model-control.ts \
            extensions/line/src/video-model-preference.ts \
            extensions/line/src/video-model-preference.test.ts \
            extensions/line/src/video-outbound-staging.ts \
            extensions/line/src/video-outbound-staging.test.ts \
            extensions/line/src/video-owner-flow.e2e.test.ts

      - name: Lint setup script
        if: steps.dependencies.outcome == 'success' && !cancelled()
        run: |
          node scripts/run-oxlint.mjs \
            --tsconfig config/tsconfig/oxlint.scripts.json \
            scripts/cloudbath/setup-notion-image-archive.ts \
            scripts/cloudbath/setup-notion-image-archive.test.ts

  production-image:
    name: Production Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout PR commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build production image
        run: |
          docker build \
            --file deploy/cloudbath/railway/Dockerfile \
            --tag cloudbath-openclaw:line-image-archive-ci \
            .

      - name: Verify plugin runtime contents
        run: |
          docker run --rm --network none \
            --entrypoint /bin/sh \
            cloudbath-openclaw:line-image-archive-ci \
            -ec '
              test -f /app/extensions/cloudbath-line-image-archive/index.ts
              test -f /app/extensions/cloudbath-line-image-archive/openclaw.plugin.json
              test -f /app/extensions/cloudbath-line-image-archive/src/notion-tools.ts
              test -f /app/extensions/cloudbath-line-image-archive/src/group-workspace-policy.ts
              test -f /app/extensions/cloudbath-line-image-archive/src/keep-watching.ts
              test -f /app/extensions/cloudbath-line-image-archive/src/ugc-workflow.ts
              test -f /app/extensions/cloudbath-line-image-archive/src/ugc-character-pending-media.ts
              test -f /app/extensions/cloudbath-line-image-archive/src/character-view-route.ts
              test -f /app/extensions/cloudbath-line-image-archive/src/character-view-url.ts
              test -f /app/extensions/cloudbath-line-image-archive/src/workspace-policy-runtime.ts
              grep -q createCharacterViewRouteHandler /app/extensions/cloudbath-line-image-archive/index.ts
              grep -q readMediaBuffer /app/extensions/cloudbath-line-image-archive/src/ugc-character-pending-media.ts
              test -f /app/extensions/cloudbath-line-image-archive/profiles/construction-site-progress.v1.json
              test -f /app/extensions/line/index.ts
              test -f /app/extensions/line/openclaw.plugin.json
              test -f /app/extensions/line/package.json
              test -f /app/dist/extensions/line/index.js
              test -f /app/dist/extensions/line/openclaw.plugin.json
              test -f /app/dist/extensions/line/package.json
              test -f /app/extensions/line/src/outbound-media-staging.ts
              test -f /app/extensions/line/src/model-catalog-tool.ts
              test -f /app/extensions/line/src/video-ugc-scope.ts
              test ! -f /app/extensions/line/src/natural-language-model.ts
              grep -q openrouter_account_models /app/extensions/line/src/model-catalog-tool.ts
              ! grep -q resolveAuthorizedLineNaturalModelAction /app/extensions/line/src/bot-handlers.ts
              grep -R -q "Session model changes require an authorized owner" /app/dist
              grep -q stageLineOutboundMessageImages /app/extensions/line/src/send.ts
              node --input-type=module -e "await import(\"@aws-sdk/client-s3\")"
              node --input-type=module -e "await import(\"@aws-sdk/s3-request-presigner\")"
              node --input-type=module -e "await import(\"typebox\")"
              node --input-type=module -e "await import(\"@line/bot-sdk\")"
            '
          docker run --rm --network none \
            --entrypoint /bin/sh \
            cloudbath-openclaw:line-image-archive-ci \
            -ec '
              printf "%s\n" "{\"channels\":{\"line\":{\"enabled\":true}}}" > /tmp/openclaw.json
              OPENCLAW_CONFIG_PATH=/tmp/openclaw.json \
                node openclaw.mjs plugins inspect line --runtime --json
            ' > /tmp/openclaw-line-inspect.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const inspect = JSON.parse(fs.readFileSync("/tmp/openclaw-line-inspect.json", "utf8"));
          if (inspect.plugin?.id !== "line" || inspect.plugin?.status !== "loaded") {
            throw new Error("official LINE plugin did not load from the runtime image");
          }
          const ownsLine = inspect.capabilities?.some(
            (entry) => entry?.kind === "channel" && entry.ids?.includes("line"),
          );
          if (!ownsLine) {
            throw new Error("official LINE plugin did not register ownership of channels.line");
          }
          NODE

      - name: Verify no credential-bearing image environment values
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess

          image = json.loads(
              subprocess.check_output(
                  ["docker", "image", "inspect", "cloudbath-openclaw:line-image-archive-ci"],
                  text=True,
              )
          )[0]
          credential_name = re.compile(
              r"(?:TOKEN|SECRET|PASSWORD|API_KEY|ACCESS_KEY|PRIVATE_KEY|CREDENTIAL)",
              re.IGNORECASE,
          )
          embedded = []
          for entry in image.get("Config", {}).get("Env", []):
              name, separator, value = entry.partition("=")
              if separator and value and credential_name.search(name):
                  embedded.append(name)

          if embedded:
              raise SystemExit(
                  "Credential-bearing environment values found in image: "
                  + ", ".join(sorted(embedded))
              )
          print("No credential-bearing environment values are embedded in the image.")
          PY
